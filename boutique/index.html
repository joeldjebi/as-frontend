<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espace boutique · Adjamé-Smart</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B6B4F">
  <style>
    :root { --bg: #F2F2F7; --card: #FFFFFF; --ink: #000; --muted: #6E6E73; --primary: #0B6B4F; --accent: #E8962A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --ink: #F5F5F7; --muted: #A1A1A6; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
    .card { width: min(440px, 100%); background: var(--card); border-radius: 24px; padding: 36px 28px; }
    .mark { width: 60px; height: 60px; border-radius: 17px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; margin: 0 auto 18px; }
    h1 { font-size: 24px; letter-spacing: -0.02em; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.5; }
    a { display: inline-block; margin-top: 22px; height: 44px; line-height: 44px; padding: 0 22px; border-radius: 22px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
    .smart { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">A</div>
    <h1>Espace boutique Adjamé<span class="smart">Smart</span></h1>
    <p>Bientôt, vous gérerez ici vos produits, vos stocks et vos commandes depuis un ordinateur. En attendant, tout se fait depuis l’application Adjamé-Smart.</p>
    <a href="https://as.vite.ci">Découvrir Adjamé-Smart</a>
  </div>
</body>
</html>
